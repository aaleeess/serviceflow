{% load sf %}<div class="field">
  <label for="{{ id }}" class="label">Usuario</label>
  <div class="input-wrap">
    <span class="icon">{% icono "usuario" %}</span>
    <input id="{{ id }}" name="username" type="text" autocomplete="username" placeholder="{{ ejemplo }}" value="{{ form.username.value|default:'' }}" required>
  </div>
</div>
<div class="field">
  <label for="{{ id }}-clave" class="label">Contraseña</label>
  <div class="input-wrap">
    <span class="icon">{% icono "candado" %}</span>
    <input id="{{ id }}-clave" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>
    <button type="button" class="eye" aria-label="Mostrar contraseña"
      onclick="const i=document.getElementById('{{ id }}-clave');const v=i.type==='password';i.type=v?'text':'password';this.setAttribute('aria-label',v?'Ocultar contraseña':'Mostrar contraseña')">{% icono "ojo" 20 %}</button>
  </div>
</div>
