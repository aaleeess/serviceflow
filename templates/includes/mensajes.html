{% load sf %}{% if messages %}<div class="messages">{% for m in messages %}
  <p role="{% if m.tags == 'error' %}alert{% else %}status{% endif %}" class="alert {% if m.tags == 'error' %}error{% elif m.tags == 'warning' %}warn{% else %}ok{% endif %}">{% if m.tags == 'error' %}{% icono "alerta" 18 2.2 %}{% else %}{% icono "check" 18 2.6 %}{% endif %}{{ m }}</p>
{% endfor %}</div>{% endif %}
